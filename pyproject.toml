[project]
name = "agentic-qa-rag"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15.0",
    "chromadb>=1.5.9",
    "langsmith>=0.14.11",
    "mcp>=2.3.0",
    "neo4j>=6.4.1",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests/rag"]
pythonpath = ["."]
