name: Agentic QA

# Runs one agentic QA workflow headless with the Claude Agent SDK — the same
# skills and subagents a QA engineer uses in Claude Code.
#   - on demand: pick the workflow and its arguments
#   - on a PR labelled `agentic-qa`: a risk-based test plan for the PR, then
#     impact-based regression with triage; the summary is posted on the PR
# Workflows that write tests or vault documents open a pull request with them.
#
# Needs one repository secret: ANTHROPIC_API_KEY, or CLAUDE_CODE_OAUTH_TOKEN
# (from `claude setup-token`). Without either, the job explains and skips.

on:
  workflow_dispatch:
    inputs:
      workflow:
        description: Workflow
        type: choice
        options:
          [qa-plan, refine-ac, api-testgen, api-journey-testgen, ui-qa, adhoc-test, regression, release-gate, learn]
      args:
        description: 'Arguments, e.g. CARD-142 · "PATCH /api/cart/items/:productId" · --base origin/main'
        type: string
        default: ''
      budget:
        description: Spend cap in USD (empty = the workflow's default)
        type: string
        default: ''
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  agent:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'agentic-qa'
    name: ${{ inputs.workflow || 'qa-plan + regression' }}
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 60
    env:
      HOME: /root
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Credentials
        id: auth
        run: |
          if [ -n "$ANTHROPIC_API_KEY$CLAUDE_CODE_OAUTH_TOKEN" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else
            echo "::notice::Set the ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN repository secret to run agentic workflows."
            echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v5
        if: steps.auth.outputs.ok == 'true'
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        if: steps.auth.outputs.ok == 'true'
        with:
          python: 'true'
      - name: Tools the agents call
        if: steps.auth.outputs.ok == 'true'
        run: |
          (type -p gh >/dev/null) || { apt-get update -qq && apt-get install -y -qq gh; }
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bunx playwright-cli install-browser chromium
          bun run rag:build

      - name: Run ${{ inputs.workflow }}
        if: steps.auth.outputs.ok == 'true' && github.event_name == 'workflow_dispatch'
        run: |
          budget=(); [ -n "$BUDGET" ] && budget=(--budget "$BUDGET")
          eval "set -- $ARGS"
          bun run agent "$WORKFLOW" "$@" "${budget[@]}"
        env:
          WORKFLOW: ${{ inputs.workflow }}
          ARGS: ${{ inputs.args }}
          BUDGET: ${{ inputs.budget }}

      - name: Plan and regress this PR
        if: steps.auth.outputs.ok == 'true' && github.event_name == 'pull_request'
        run: |
          bun run agent qa-plan --base "origin/$BASE"
          bun run agent regression --base "origin/$BASE"
        env:
          BASE: ${{ github.base_ref }}

      - name: Comment the summary on the PR
        if: ${{ !cancelled() && steps.auth.outputs.ok == 'true' && github.event_name == 'pull_request' }}
        run: |
          cat out/agent-runs/*/summary.md > out/pr-comment.md
          gh pr comment "$PR" --body-file out/pr-comment.md
        env:
          PR: ${{ github.event.pull_request.number }}

      - name: Open a PR with what the agent wrote
        if: ${{ success() && steps.auth.outputs.ok == 'true' && github.event_name == 'workflow_dispatch' }}
        run: |
          git add -A tests framework knowledge
          if git diff --cached --quiet; then echo "Nothing written."; exit 0; fi
          branch="agentic/$WORKFLOW-$GITHUB_RUN_NUMBER"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "agentic-qa: $WORKFLOW $ARGS" -m "Generated by the $WORKFLOW workflow, run $GITHUB_RUN_ID."
          git push origin "HEAD:$branch"
          gh pr create --head "$branch" --title "agentic-qa: $WORKFLOW $ARGS" --body-file "$(ls -d out/agent-runs/*/ | tail -1)summary.md"
        env:
          WORKFLOW: ${{ inputs.workflow }}
          ARGS: ${{ inputs.args }}

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.auth.outputs.ok == 'true' }}
        with:
          name: agent-runs
          path: |
            out/agent-runs/
            out/plans/
            out/ac/
            out/adhoc/
            out/release/
            out/*.md
          retention-days: 14
