# Azure DevOps equivalent of .github/workflows/ci.yml + agentic-qa.yml: quality gates, parallel regression with
# results published to Azure Test Plans (Test Runs), the Go/No-Go gate, and the Claude Agent SDK regression
# workflow when a key is configured. Runs on Microsoft-hosted Ubuntu VMs (browsers installed with their OS
# libraries); the GitHub workflows are the ones exercised on every push.
#
# Variables (pipeline or variable group): STRING_HEX_SHOPLITE (secret, decrypts env/),
# ANTHROPIC_API_KEY (secret, optional).

trigger:
  branches:
    include: [main]
pr:
  branches:
    include: [main]

pool:
  vmImage: ubuntu-24.04

stages:
  - stage: Quality
    jobs:
      - job: checks
        displayName: lint · types · format · unit · catalogs
        steps:
          - template: .azure/setup.yml
          - script: bun run lint && bun run typecheck && bun run format:check && bun run test:unit
            displayName: Lint, types, format, unit tests
          - script: bun run qa:arrange --check && bun run qa:vault
            displayName: Recipe catalog and vault frontmatter

  - stage: Regression
    dependsOn: Quality
    jobs:
      - job: tests
        displayName: Playwright
        strategy:
          matrix:
            api: { PROJECT: api, BROWSER: '' }
            chromium: { PROJECT: chromium, BROWSER: chromium }
            firefox: { PROJECT: firefox, BROWSER: firefox }
            webkit: { PROJECT: webkit, BROWSER: webkit }
          maxParallel: 4
        steps:
          - template: .azure/setup.yml
          - script: test -z "$(BROWSER)" || bunx playwright install --with-deps "$(BROWSER)"
            displayName: Install the browser
          - script: bun --bun playwright test --project=$(PROJECT)
            displayName: Test $(PROJECT)
            env:
              CI: 'true'
              PW_JSON_OUTPUT: out/results-$(PROJECT).json
              STRING_HEX_SHOPLITE: $(STRING_HEX_SHOPLITE)
          - task: PublishTestResults@2
            displayName: Publish to Test Runs
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: test-results/junit.xml
              testRunTitle: Regression · $(PROJECT)
              mergeTestResults: true
          - publish: out/results-$(PROJECT).json
            artifact: results-$(PROJECT)
            condition: succeededOrFailed()
          - publish: playwright-report
            artifact: playwright-report-$(PROJECT)
            condition: failed()

      - job: defects
        displayName: Seeded-defect detection
        steps:
          - template: .azure/setup.yml
          - script: bun run qa:defects
            env:
              STRING_HEX_SHOPLITE: $(STRING_HEX_SHOPLITE)

  - stage: Gate
    dependsOn: Regression
    condition: succeededOrFailed()
    jobs:
      - job: gate
        displayName: Go/No-Go
        steps:
          - template: .azure/setup.yml
          - download: current
            patterns: 'results-*/*.json'
          - script: |
              for f in $(Pipeline.Workspace)/results-*/*.json; do
                bun run qa:gate --results "$f"
              done
            displayName: Release assessment per project

  - stage: Agentic
    dependsOn: Quality
    jobs:
      - job: agent
        displayName: Claude Agent SDK · impact-based regression
        timeoutInMinutes: 60
        steps:
          - checkout: self
            fetchDepth: 0
          # Secret variables can't be read in a stage condition; the job checks for the key itself.
          - script: |
              if [ -z "$ANTHROPIC_API_KEY" ]; then
                echo "##vso[task.logissue type=warning]Set ANTHROPIC_API_KEY to run the agentic stage."
                echo "##vso[task.setvariable variable=SKIP_AGENT]true"
              fi
            displayName: Credentials
            env:
              ANTHROPIC_API_KEY: $(ANTHROPIC_API_KEY)
          - template: .azure/setup.yml
            parameters:
              browser: chromium
              python: true
          - script: bunx playwright-cli install-browser chromium && bun run rag:build
            displayName: Tools the agents call
            condition: ne(variables['SKIP_AGENT'], 'true')
          - script: bun run agent regression --base origin/main
            displayName: Agentic regression
            condition: ne(variables['SKIP_AGENT'], 'true')
            env:
              ANTHROPIC_API_KEY: $(ANTHROPIC_API_KEY)
              STRING_HEX_SHOPLITE: $(STRING_HEX_SHOPLITE)
          - publish: out/agent-runs
            artifact: agent-runs
            condition: and(succeededOrFailed(), ne(variables['SKIP_AGENT'], 'true'))
