# Step template: Bun at the version package.json pins, the locked packages, and optionally one Playwright browser
# (with its OS libraries) and uv + the RAG environment. The Azure twin of .github/actions/setup.
parameters:
  - name: browser
    type: string
    default: ''
  - name: python
    type: boolean
    default: false

steps:
  - script: |
      version="$(jq -r '.packageManager | sub("^bun@"; "")' package.json)"
      curl -fsSL https://bun.sh/install | bash -s "bun-v$version"
      echo "##vso[task.prependpath]$HOME/.bun/bin"
    displayName: Install Bun (version from package.json)
  - script: bun install --frozen-lockfile
    displayName: Install packages
  - ${{ if ne(parameters.browser, '') }}:
      - script: bunx playwright install --with-deps ${{ parameters.browser }}
        displayName: Install ${{ parameters.browser }}
  - ${{ if eq(parameters.python, true) }}:
      - script: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "##vso[task.prependpath]$HOME/.local/bin"
        displayName: Install uv
      - script: uv sync --frozen
        displayName: Sync the RAG environment
