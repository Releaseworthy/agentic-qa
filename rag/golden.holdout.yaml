# Held-out retrieval questions: never used to tune or choose anything. The first 14 were written after the ranking
# priors (DERIVED_WEIGHT in rag/hybrid.py) were tuned on rag/golden.yaml; the rest on 2026-10-17, before any of them
# was run. `bun run rag:eval` reports them separately, so the headline numbers are not only in-sample. Add questions
# here; never change the ranking to make one of these pass. Choose changes on rag/golden.dev.yaml.

